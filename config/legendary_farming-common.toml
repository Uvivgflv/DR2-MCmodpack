
#Per-crop mega crop settings
[megaCrops]

	[megaCrops.carrot]
		#Whether carrot can turn into mega crops
		enabled = true
		#Percent chance for a fully grown carrot to turn mega (0.5 = 1 in 200)
		#Range: 0.0 ~ 100.0
		chancePercent = 0.5
		#Minimum items dropped when harvesting a mega carrot
		#Range: 0 ~ 1024
		dropMin = 20
		#Maximum items dropped when harvesting a mega carrot
		#Range: 0 ~ 1024
		dropMax = 30
		#Minimum experience points dropped when harvesting a mega carrot
		#Range: 0 ~ 10000
		xpMin = 50
		#Maximum experience points dropped when harvesting a mega carrot
		#Range: 0 ~ 10000
		xpMax = 75

